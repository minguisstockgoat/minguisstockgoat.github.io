<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대시보드 운영 점검</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#18283b;margin:0;padding:36px 20px;line-height:1.7}.wrap{max-width:1180px;margin:auto}a{color:#236b9e}h1{margin:16px 0 6px}h2{margin-top:36px}.meta{color:#5c6c80;font-size:14px;max-width:900px}.table{overflow:auto;border-radius:12px;background:white;margin-top:22px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:14px 16px;border-bottom:1px solid #e2e7ed;text-align:left;vertical-align:top;font-size:13px}th{color:#54697d;white-space:nowrap}td:nth-child(1){min-width:145px;font-weight:650}td:nth-child(2){min-width:100px;color:#8b601c}.priorities{display:grid;gap:12px}.item{background:white;border-radius:10px;padding:16px 20px}.item p{margin:6px 0;color:#526579}.evidence{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}footer{margin-top:30px;color:#6e7d8e;font-size:12px}</style></head><body><main class="wrap"><a href="index.html">← 통합 대시보드</a><h1>대시보드 운영 점검</h1><p class="meta" id="meta">점검 결과를 불러오는 중…</p><div class="table"><table><thead><tr><th>대시보드</th><th>판정</th><th>확인한 자료</th><th>문제·조치·해석</th></tr></thead><tbody id="results"></tbody></table></div><h2>남은 보완 과제</h2><section class="priorities" id="priorities"></section><h2>근거와 운영 화면</h2><div class="evidence" id="evidence"></div><footer>이 페이지는 2026-11-04 점검 기록입니다. 허브 카드의 기준일 표시는 방문할 때 공개 데이터를 다시 확인합니다.</footer></main><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('audit-20261104.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{document.querySelector('#meta').textContent=d.checked_at+' · '+d.scope;document.querySelector('#results').innerHTML=d.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.state)+'</td><td>'+esc(r.observed)+'</td><td>'+esc(r.finding)+'</td></tr>').join('');document.querySelector('#priorities').innerHTML=d.priorities.map(r=>'<article class="item"><strong>'+esc(r.priority)+' · '+esc(r.item)+'</strong><p>'+esc(r.action)+'</p></article>').join('');document.querySelector('#evidence').innerHTML=d.evidence.map(r=>'<a target="_blank" rel="noopener" href="'+esc(r.url)+'">'+esc(r.label)+'</a>').join('')}).catch(e=>document.querySelector('#meta').textContent='점검 기록을 불러오지 못했습니다: '+e.message);
</script></body></html>
